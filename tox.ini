[flake8]
ignore = E203, E266, E731, W503
max-line-length = 88
max-complexity = 12
select = B, C, E, F, W, T4
exclude = .venv, .tox, .eggs, .github, build, dist

[tox]
envlist = clean, fmt-check, lint, docs, py38, py310, py312, py313, report
skip_missing_interpreters = true

[gh-actions]
python =
    3.8: py38
    3.10: py310
    3.12: py312
    3.13: clean, fmt-check, lint, docs, py313, report

[testenv]
usedevelop = true
setenv =
    PYTHONPATH={toxinidir}/tests
    CUDA_PATH={env:CUDA_PATH:}
deps =
    cython
    pytest
    pytest-cov
    pybind11>=2.6
commands =
    pytest --cov --cov-report=term-missing -vv

[testenv:fmt]
skip_install = true
deps =
    black==26.1.0
    isort
commands =
    isort .
    black .

[testenv:fmt-check]
skip_install = true
deps =
    black==26.1.0
    isort
commands =
    isort --diff .
    black --check .

[testenv:lint]
skip_install = true
deps =
    flake8
commands =
    flake8 . --count --show-source --statistics

[testenv:docs]
usedevelop = true
deps =
    cython
    pybind11>=2.6
    jupyter>=1.0
    numpydoc
    myst-nb>=0.17
    pydata-sphinx-theme
commands = 
    sphinx-build -E -b html docs dist/docs
    sphinx-build -b linkcheck docs dist/docs

[testenv:report]
skip_install = true
deps =
    coverage[toml]
    pybind11>=2.6
commands =
    coverage report
    coverage html

[testenv:clean]
skip_install = true
deps =
    coverage[toml]
    pybind11>=2.6
commands =
    coverage erase

[build-system]
requires = ["setuptools>=46.0", "wheel", "pybind11>=2.6", "cython"]
build-backend = "setuptools.build_meta"

[project]
name = "lightspot"
description = "Modelization of light curves from spotted stars"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Eduardo Nunes", email = "dioph@pm.me"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "dynesty >= 1.0",
    "h5py",
    "matplotlib",
    "scipy >= 0.19",
    "ultranest >= 3.0",
]
dynamic = ["version"]

[project.optional-dependencies]
cuda = ["cupy-cuda13x[ctk]", "numba-cuda[cu13]"]
docs = ["jupyter >= 1.0", "myst-nb >= 0.17", "numpydoc", "pydata-sphinx-theme"]
test = ["black==26.1.0", "flake8", "isort", "pytest", "pytest-cov", "tox"]

[tool.setuptools.dynamic]
version = {attr = "lightspot.__version__"}

[tool.black]
line-length = 88
target-version = ["py38", "py310", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 88
force_sort_within_sections = true
src_paths = ["src"]

[tool.coverage.run]
branch = true
source = ["src", "tests"]
parallel = true

[tool.coverage.paths]
source = ["src"]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.pytest.ini_options]
testpaths = ["tests"]
